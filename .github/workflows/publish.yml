# Builds the book and deploys it to GitHub Pages on every push to main.
# Executing the teaching chunks keeps rendered figures, tables, and cross-references
# available to readers of the static GitHub Pages site.
name: Publish book

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install system libraries for R graphics
        run: sudo apt-get update && sudo apt-get install --yes libcairo2-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Restore R dependencies
        run: Rscript -e 'renv::restore(prompt = FALSE); install.packages(c("deaR", "lpSolve"))'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37

      - name: Render book
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
